e('createRoom').onclick=async()=>{if(!uid)return status('Connexion en cours…');try{roomCount=Number(e('count').value);playerCount=roomCount;const mode=e('gameMode').value;const id=code();e('mode').value=mode;original.init();const initial=state();const firstSeat=seatsFor(roomCount)[0];await setDoc(doc(db,'games',id),{owner:uid,players:[{uid,name:name(),seat:firstSeat}],playerIds:[uid],playerCount:roomCount,revision:0,state:initial,createdAt:serverTimestamp()});watch(id)}catch(err){status('Création impossible : '+err.message)}};
e('joinRoom').onclick=async()=>{if(!uid)return status('Connexion en cours…');const id=e('roomCode').value.trim().toUpperCase();if(!id)return status('Entre un code');try{const ref=doc(db,'games',id);await runTransaction(db,async tx=>{const snap=await tx.get(ref);if(!snap.exists())throw Error('Code introuvable');const d=snap.data(),list=d.players||[],count=d.playerCount||4;if(list.some(p=>p.uid===uid))return;if(list.length>=count)throw Error('Partie complète');tx.update(ref,{players:[...list,{uid,name:name(),seat:seatsFor(count)[list.length]}],playerIds:[...(d.playerIds||[]),uid]})});watch(id)}catch(err){status('Impossible de rejoindre : '+err.message)}};
e('leaveRoom').onclick=()=>{if(unsub)unsub();unsub=null;room=null;seat=-1;players=[];e('share').style.display='none';e('leaveRoom').hidden=true;status('Déconnecté de la partie');playerCount=4;original.init();controls()};
e('copyRoom').onclick=async()=>{try{await navigator.clipboard.writeText(room);status('Code copié : '+room)}catch{status('Copie ce code : '+room)}};
try{await signInAnonymously(auth);uid=auth.currentUser.uid;status('Connecté à Firebase. Crée ou rejoins une partie.');const url=new URL(location.href);const codeFromLink=url.searchParams.get('room');if(codeFromLink)e('roomCode').value=codeFromLink.toUpperCase()}catch(err){status('Connexion Firebase impossible : '+err.message)}
controls();
</script>
