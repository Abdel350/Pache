<!doctype html><html lang=fr><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>PACHE</title><style>body{background:#17212b;color:white;font:16px system-ui;margin:12px;text-align:center}main{max-width:540px;margin:auto}svg{width:100%;background:white;border-radius:8px;touch-action:manipulation}button,select{font:inherit;padding:12px;border:0;border-radius:9px;margin:3px;cursor:pointer}button:disabled{opacity:.4}#dice{display:flex;justify-content:center}#dice button{flex:1;font-size:24px;font-weight:bold}#log{font-size:13px;color:#ccd5df;text-align:left}h1{letter-spacing:5px}#msg{min-height:48px}</style><main><h1>PACHE</h1><select id=mode><option value=team>2 contre 2</option><option value=solo>Individuel</option></select><p id=score></p><svg id=board viewBox="0 0 440 440"></svg><p id=msg></p><div id=dice></div><button id=claim>Soufflette</button><button id=reset>Recommencer</button><div id=log></div></main><script>
const $=x=>document.getElementById(x),S=$('board'),C=['#f4d21d','#168bd2','#ee3838','#38a34b'],N=['Jaune','Bleu','Rouge','Vert'],start=[5,22,39,56],safe=new Set([5,12,17,22,29,34,39,46,51,56,63,68]),P={},T={},H=[[0,0],[0,300],[300,300],[300,0]];let a,turn,n,b,replay,fault,phase,stamp,logs;function rot(x,y,k){while(k--)[x,y]=[y,440-x];return[x,y]}function el(tag,attrs,parent=S){let e=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));parent.append(e);return e}function rect(x,y,w,h,fill,g=S){el('rect',{x,y,width:w,height:h,fill,stroke:'#555','stroke-width':.7},g)}function text(x,y,v,g){el('text',{x,y,fill:'#222','font-size':11,'text-anchor':'middle','dominant-baseline':'central'},g).textContent=v}function init(){a=Array.from({length:16},(_,id)=>({id,c:id>>2,p:-1,s:0}));turn=0;n=b=stamp=0;replay=false;fault=[];phase='roll';logs=[];draw()}function key(p,i=p.p){return i<0||i>=71?null:i<64?'r'+((start[p.c]-1+i)%68+1):'t'+p.c+':'+(i-64)}function at(k){return k?a.filter(p=>key(p)===k):[]}function done(c){return a.filter(p=>p.c===c&&p.p===71).length}function team(){return $('mode').value==='team'}function active(){return team()&&done(turn)===4?(turn+2)%4:turn}function enemy(c,d){return c!==d&&(!team()||(c+2)%4!==d)}function legal(p){if(p.c!==active()||p.p===71)return;if(p.p<0){if(b||n!==5)return;let q=at(key(p,0)).sort((x,y)=>x.s-y.s);if(q.length===2&&q[1].c===p.c)return;return {p,to:0,cap:q.length===2?q[1]:null}}let to=p.p+(b||n);if(to>71)return;for(let i=p.p+1;i<=to;i++)if(at(key(p,i)).length>=2)return;let k=key(p,to),q=at(k),cap=q.length&&q[0].c!==p.c&&k.startsWith('r')&&!safe.has(+k.slice(1))?q[0]:null;return {p,to,cap}}function moves(){return a.map(legal).filter(Boolean)}function opens(m){let q=at(key(m.p));return m.p.p>=0&&m.p.p<64&&q.length===2&&q.every(p=>p.c===m.p.c)}function log(s){logs.unshift(s);logs=logs.slice(0,8)}function finish(){n=b=0;phase='roll';if(!replay){do{turn=(turn+1)%4}while(!team()&&done(turn)===4)}replay=false;draw()}function prepare(){phase='move';if(!moves().length){log(b?'Bonus perdu':'Aucun déplacement');finish()}else draw()}function roll(v){if(phase!=='roll')return;fault=[];n=v;b=0;replay=v===7;log(N[turn]+' : '+v);prepare()}function move(id){if(phase!=='move')return;let ms=moves(),m=ms.find(m=>m.p.id===id);if(!m)return;let req=!b&&n===7&&ms.some(opens)?ms.filter(opens):ms.filter(m=>m.cap&&enemy(m.p.c,m.cap.c));if(req.length&&!req.includes(m))fault.push(m.p.c);m.p.p=m.to;m.p.s=++stamp;if(m.cap){m.cap.p=-1;log(N[m.p.c]+' mange '+N[m.cap.c]+' +20')}else log(N[m.p.c]+' : '+(key(m.p)||'arrivée'));if(team()?done(m.p.c)+done((m.p.c+2)%4)===8:done(m.p.c)===4){phase='win';draw();return}if(m.cap){b=20;prepare()}else if(m.to===71){b=10;prepare()}else finish()}function claim(){if(!fault.length){log('Soufflette refusée');draw();return}let c=fault.shift();fault=fault.filter(x=>x!==c);a.filter(p=>p.c===c&&p.p<64).forEach(p=>p.p=-1);log('Soufflette : '+N[c]);if(phase==='move'&&!moves().length)finish();else draw()}
function draw(){S.innerHTML='';for(let k=0;k<4;k++){let [x,y]=H[k];rect(x,y,140,140,C[k]);let g=el('g',{transform:`rotate(${-90*k} 220 220)`});for(let i=0;i<8;i++){let l=k*17+i+1,r=((k*17+66-i)%68)+1,y=i<7?i*20:140;P[l]=rot(165,y+10,k);P[r]=rot(275,y+10,k);rect(140,y,50,20,l===start[k]?C[k]:safe.has(l)?'#ccc':'white',g);rect(250,y,50,20,safe.has(r)?'#ccc':'white',g);text(165,y+10,l,g);text(275,y+10,r,g);rect(190,y,60,20,i?C[k]:'#ccc',g);if(i)T[k+':'+(i-1)]=rot(220,y+10,k)}let z=((k*17+67)%68)+1;P[z]=rot(220,10,k);text(220,10,z,g);el('polygon',{points:'190,160 250,160 220,220',fill:C[k]},g)}let ids=phase==='move'?moves().map(m=>m.p.id):[];a.forEach(p=>{let x,y;if(p.p<0){[x,y]=H[p.c];x+=40+p.id%2*52;y+=40+Math.floor(p.id%4/2)*52}else if(p.p===71){[x,y]=rot(213+p.id%2*13,174+Math.floor(p.id%4/2)*13,p.c)}else{let k=key(p);[x,y]=k[0]==='r'?P[+k.slice(1)]:T[k.slice(1)];let q=at(k);if(q.length===2)x+=q[0]===p?-7:7}let g=el('g',{});el('circle',{cx:x,cy:y,r:p.p<0?17:p.p===71?6:10,fill:C[p.c],stroke:ids.includes(p.id)?'white':'#222','stroke-width':ids.includes(p.id)?3:1.3},g);el('circle',{cx:x,cy:y,r:15,fill:'transparent'},g);g.onclick=()=>move(p.id)});$('score').textContent=N.map((s,i)=>s+' '+done(i)+'/4').join(' · ');$('msg').textContent=phase==='win'?'Victoire !':N[turn]+(phase==='roll'?' — indique le dé':' — '+(b?'bonus '+b:n+' cases')+' : choisis un pion');$('dice').innerHTML='';[1,2,3,4,5,7].forEach(v=>{let e=document.createElement('button');e.textContent=v;e.disabled=phase!=='roll';e.onclick=()=>roll(v);$('dice').append(e)});$('log').textContent=logs.join(' • ')}$('claim').onclick=claim;$('reset').onclick=()=>{if(confirm('Recommencer ?'))init()};$('mode').onchange=init;init();</script>
