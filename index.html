function ownsColor(color){return seat>=0&&(roomTeam&&roomCount===2?(seat===0?[0,2]:[1,3]).includes(color):seat===color)}
function myTurn(){return !!room&&players.length===roomCount&&ownsColor(currentSeat())}
function controls(){displayNames=[...N];for(const p of players){let colors=roomTeam&&roomCount===2?(p.seat===0?[0,2]:[1,3]):[p.seat];for(const c of colors)if(c>=0&&c<4)displayNames[c]=p.name||N[c];}const online=!!room,ready=players.length===roomCount,allow=!online||(myTurn()&&loadedRevision&&!busy&&!refreshing);e('throw').disabled=!allow||phase!=='roll'||rolling;e('claim').disabled=false;e('refresh').disabled=refreshing;e('reset').disabled=online;e('mode').disabled=online;e('dieMode').disabled=online||rolling||phase!=='roll';e('count').disabled=online;e('gameMode').disabled=online;for(const btn of e('dice').querySelectorAll('button'))btn.disabled=!allow||phase!=='roll';e('board').style.pointerEvents=allow?'auto':'none';e('connection').textContent=!online?'🎲 Mode local':!ready?'⏳ En attente des joueurs':busy?'🔄 Envoi du coup…':'🟢 Connecté · synchro n°'+revision;e('players').textContent=online?players.map((p,i)=>`${roomTeam&&roomCount===2?(p.seat===0?'Jaune/Rouge':'Bleu/Vert'):N[p.seat??i]} : ${p.name}${p.uid===uid?' (toi)':''}`).join(' · ')+(ready?'':' · En attente…'):'';if(online){e('msg').textContent=ready?`Tour de ${players.find(p=>roomTeam&&roomCount===2?(p.seat===0?[0,2]:[1,3]).includes(currentSeat()):p.seat===currentSeat())?.name||N[currentSeat()]} — ${phase==='move'?(b?'bonus '+b:n+' cases'):'dé à lancer'}`:`En attente de ${roomCount} joueurs (${players.length}/${roomCount})`;}}
window.draw=function(){original.draw();controls()};
async function saveAction(kind,value){
  if(busy||refreshing||!loadedRevision||!room){if(kind==='claim')status('Synchronisation en cours : réessaie dans un instant');return;}
  const claiming=kind==='claim';
  if(claiming?!ownsColor(fault[0]?.claimant):!myTurn())return;
  const before=state(),beforeRevision=revision,codeAtStart=room;
  busy=true;
  const startTime=performance.now();
  try{
    // Calcul local immédiat : aucun aller-retour de lecture avant l'écriture.
    if(kind==='roll'){
      lastDie=value===7?6:value;
      original.roll(value);
    }else if(kind==='move')original.move(value);
    else if(kind==='stationary')original.stationaryCapture(value);
    else if(kind==='claim')original.claim(fault[0]?.claimant);
    const next=state();
    const nextRevision=beforeRevision+1;
    revision=nextRevision;
    controls();
    status('Envoi du coup…');
    // Firestore vérifie côté serveur l'appartenance et la révision +1.
    await runTransaction(db,async tx=>{const ref=doc(db,'games',codeAtStart);const snap=await tx.get(ref);if(!snap.exists())throw Error('Partie introuvable');if((snap.data().revision||0)!==beforeRevision)throw Error('Un autre coup a été joué : état actualisé');tx.update(ref,{state:next,revision:nextRevision});});
    if(room!==codeAtStart)return;
    status('Coup synchronisé · '+Math.round(performance.now()-startTime)+' ms');
  }catch(err){
    if(room!==codeAtStart)return;
    // Ne pas écraser un état plus récent déjà reçu pendant l'envoi.
    if(revision===beforeRevision+1){
      revision=beforeRevision;
      load(before);
    }
    status('Action non enregistrée : '+err.message);
    // Relecture de sécurité en cas de coup concurrent.
    try{
      const snap=await getDoc(doc(db,'games',codeAtStart));
      if(room===codeAtStart&&snap.exists()){
        const d=snap.data(),r=d.revision||0;
        if(r>=revision){revision=r;load(d.state);}
      }
    }catch(_){}
  }finally{
    busy=false;
    if(room===codeAtStart){
      if(pendingSnapshot){const pending=pendingSnapshot;pendingSnapshot=null;applySnapshot(pending);}
      controls();
    }
  }
}
window.roll=v=>room?saveAction('roll',v):original.roll(v);
window.move=id=>room?saveAction('move',id):original.move(id);
window.stationaryCapture=id=>room?saveAction('stationary',id):original.stationaryCapture(id);
window.claim=()=>{if(room){if(busy){status('Synchronisation en cours : réessaie dans un instant');return}if(!fault[0]){status('Aucune faute réclamable actuellement');return}if(!ownsColor(fault[0].claimant)){status('Soufflette réservée à '+N[fault[0].claimant]);return}saveAction('claim');}else original.claim(fault[0]?.claimant??-1)};
const previousThrow=e('throw').onclick;e('throw').onclick=()=>{if(room&&(!myTurn()||busy||refreshing||!loadedRevision))return;previousThrow()};
function applySnapshot(d){
  players=d.players||[];roomCount=d.playerCount||4;roomTeam=d.state?.mode==='team';
  seat=players.find(p=>p.uid===uid)?.seat??-1;
  if(seat<0){status('Tu ne fais pas partie de cette partie');controls();return;}
  const incomingRevision=d.revision||0;
  if(incomingRevision<revision)return;
  if(busy){pendingSnapshot=d;return;}
  if(incomingRevision!==revision||!loadedRevision){
    revision=incomingRevision;
    if(d.state)load(d.state);
    loadedRevision=true;
  }
  controls();
  status((players.length===roomCount?'Partie prête !':'Connecté — '+players.length+'/'+roomCount+' joueurs')+' · Synchro n°'+revision);
}
let watchGeneration=0,refreshTimer=null;
function watch(code,reconnect=false){
  if(unsub)unsub();const generation=++watchGeneration;
  pendingSnapshot=null;loadedRevision=false;if(!reconnect)revision=0;room=code;
  e('roomCode').value=code;e('roomLabel').textContent=code;e('share').style.display='block';e('leaveRoom').hidden=false;controls();
  unsub=onSnapshot(doc(db,'games',code),{includeMetadataChanges:true},snap=>{
    if(generation!==watchGeneration||room!==code||snap.metadata.hasPendingWrites||snap.metadata.fromCache)return;
    if(!snap.exists()){refreshMessage('Partie introuvable');return;}
    applySnapshot(snap.data());
    if(refreshing&&!busy&&loadedRevision){clearTimeout(refreshTimer);refreshing=false;controls();refreshMessage('✅ Partie reconnectée · synchro n°'+revision);}
  },err=>{if(generation!==watchGeneration)return;clearTimeout(refreshTimer);refreshing=false;controls();refreshMessage('Erreur de synchronisation : '+err.message);});
}
e('refresh').onclick=()=>{
  if(!room){refreshMessage('Refresh disponible uniquement dans une partie en ligne');return;}
  if(busy){refreshMessage('⏳ Coup en cours d’envoi : réessaie après confirmation');return;}
  if(refreshing)return;
  refreshing=true;refreshMessage('🔄 Reconnexion à la partie…');watch(room,true);
  clearTimeout(refreshTimer);refreshTimer=setTimeout(()=>{if(refreshing){refreshing=false;controls();refreshMessage('⚠️ Serveur sans réponse : réessaie Refresh');}},8000);
};
const name=()=>e('nickname').value.trim().slice(0,22)||'Joueur';
const code=()=>Math.random().toString(36).slice(2,8).toUpperCase();
e('count').onchange=()=>{e('gameMode').querySelector('[value=team]').disabled=e('count').value==='3';if(e('count').value==='3')e('gameMode').value='solo'};
e('count').onchange();
e('createRoom').onclick=async()=>{if(!uid)return status('Connexion en cours…');try{roomCount=Number(e('count').value);playerCount=roomCount;const mode=e('gameMode').value;roomTeam=mode==='team';if(roomTeam)playerCount=4;const id=code();e('mode').value=mode;original.init();const initial=state();const firstSeat=roomTeam&&roomCount===2?0:seatsFor(roomCount)[0];await setDoc(doc(db,'games',id),{owner:uid,players:[{uid,name:name(),seat:firstSeat}],playerIds:[uid],playerCount:roomCount,revision:0,state:initial,createdAt:serverTimestamp()});watch(id)}catch(err){status('Création impossible : '+err.message)}};
e('joinRoom').onclick=async()=>{if(!uid)return status('Connexion en cours…');const id=e('roomCode').value.trim().toUpperCase();if(!id)return status('Entre un code');if(busy)return status('Coup en cours');if(id===room){e('refresh').onclick();return;}try{const ref=doc(db,'games',id);await runTransaction(db,async tx=>{const snap=await tx.get(ref);if(!snap.exists())throw Error('Code introuvable');const d=snap.data(),list=d.players||[],count=d.playerCount||4;if(list.some(p=>p.uid===uid))return;if(list.length>=count)throw Error('Partie complète');tx.update(ref,{players:[...list,{uid,name:name(),seat:d.state?.mode==='team'&&count===2?list.length:seatsFor(count)[list.length]}],playerIds:[...(d.playerIds||[]),uid]})});watch(id)}catch(err){status('Impossible de rejoindre : '+err.message)}};
e('leaveRoom').onclick=()=>{if(unsub)unsub();++watchGeneration;clearTimeout(refreshTimer);refreshing=false;unsub=null;room=null;pendingSnapshot=null;seat=-1;players=[];e('refreshFeedback').textContent='';displayNames=[...N];e('share').style.display='none';e('leaveRoom').hidden=true;status('Déconnecté de la partie');playerCount=4;roomTeam=false;original.init();controls()};
e('copyRoom').onclick=async()=>{try{await navigator.clipboard.writeText(room);status('Code copié : '+room)}catch{status('Copie ce code : '+room)}};
try{await signInAnonymously(auth);uid=auth.currentUser.uid;status('Connecté à Firebase. Crée ou rejoins une partie.');const url=new URL(location.href);const codeFromLink=url.searchParams.get('room');if(codeFromLink)e('roomCode').value=codeFromLink.toUpperCase()}catch(err){status('Connexion Firebase impossible : '+err.message)}
controls();
</script>
