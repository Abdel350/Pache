function draw(){S.innerHTML='';let defs=el('defs',{});const light=['#fff5a1','#82caff','#ff9890','#a3ed83'],dark=['#987500','#03477f','#8a0c15','#18601e'];for(let k=0;k<4;k++){let grad=el('radialGradient',{id:'pawn'+k,cx:'30%',cy:'20%',r:'85%'},defs);[[0,light[k]],[.6,C[k]],[1,dark[k]]].forEach(([offset,color])=>el('stop',{offset,'stop-color':color},grad))}for(let k=0;k<4;k++){let [x,y]=H[k];rect(x,y,140,140,C[k]);el('rect',{x:x+12,y:y+12,width:116,height:116,rx:14,fill:'#fff',opacity:.8});for(let j=0;j<4;j++)el('circle',{cx:x+40+j%2*60,cy:y+40+Math.floor(j/2)*60,r:23,fill:dark[k],opacity:.14});let g=el('g',{transform:`rotate(${-90*k} 220 220)`});for(let i=0;i<8;i++){let l=k*17+i+1,r=((k*17+66-i)%68)+1,y=i*17.5;P[l]=rot(165,y+8.75,k);P[r]=rot(275,y+8.75,k);rect(140,y,50,17.5,l===start[k]?C[k]:safe.has(l)?'#ccc':'white',g);rect(250,y,50,17.5,safe.has(r)?'#ccc':'white',g);text(165,y+8.75,l,g);text(275,y+8.75,r,g);rect(190,y,60,17.5,i?C[k]:'#ccc',g);if(i)T[k+':'+(i-1)]=rot(220,y+8.75,k)}let z=((k*17+67)%68)+1;P[z]=rot(220,8.75,k);text(220,8.75,z,g);el('polygon',{points:'140,140 300,140 220,220',fill:C[k]},g)}let ids=phase==='move'?moves().map(m=>m.p.id):[];a.forEach(p=>{let x,y;if(p.p<0){[x,y]=H[p.c];x+=40+p.id%2*60;y+=40+Math.floor(p.id%4/2)*60}else if(p.p===71){[x,y]=rot(213+p.id%2*13,174+Math.floor(p.id%4/2)*13,p.c)}else{let k=key(p);[x,y]=k[0]==='r'?P[+k.slice(1)]:T[k.slice(1)];let q=at(k);if(q.length===2){let d=q[0]===p?-10:10;let arm=k[0]==='r'?Math.floor((+k.slice(1)-1)/17):p.c; if(k[0]==='r'){const xx=x-220,yy=y-220;arm=Math.abs(yy)>=Math.abs(xx)?0:1;}if(arm%2)y+=d;else x+=d}}let g=el('g',{}),r=p.p<0?21:p.p===71?6:8.5;el('ellipse',{cx:x,cy:y+r*.75,rx:r,ry:r*.35,fill:'#000',opacity:.21},g);el('circle',{cx:x,cy:y+r*.17,r,fill:dark[p.c]},g);el('circle',{cx:x,cy:y,r,fill:'url(#pawn'+p.c+')',stroke:ids.includes(p.id)?'#fff':dark[p.c],'stroke-width':ids.includes(p.id)?2:.6},g);el('circle',{cx:x,cy:y,r:r*.75,fill:'none',stroke:'#fff','stroke-opacity':.35},g);el('ellipse',{cx:x-r*.28,cy:y-r*.48,rx:r*.48,ry:r*.2,fill:'#fff',opacity:.35},g);el('circle',{cx:x,cy:y,r:p.p<0?23:9.5,fill:'transparent'},g);g.onclick=()=>move(p.id)});$('score').textContent=N.map((s,i)=>s+' '+done(i)+'/4').join(' · ');$('msg').textContent=phase==='win'?'Victoire !':N[turn]+(phase==='roll'?(rolling?' — dé en cours…':$('dieMode').value==='virtual'?' — lance le dé':' — indique le dé'):' — '+(b?'bonus '+b:n+' cases')+' : choisis un pion');$('dice').innerHTML='';[1,2,3,4,5,7].forEach(v=>{let e=document.createElement('button');e.textContent=v;e.disabled=phase!=='roll';e.onclick=()=>roll(v);$('dice').append(e)});$('log').textContent=logs.join(' • ');syncDie()}$('claim').onclick=claim;$('reset').onclick=()=>{if(confirm('Recommencer ?'))init()};$('mode').onchange=init;

async function saveAction(kind,value){if(!myTurn()||busy)return;busy=true;try{const ref=doc(db,'games',room),result=await runTransaction(db,async tx=>{const snap=await tx.get(ref);if(!snap.exists())throw Error('Partie introuvable');const data=snap.data();if(data.revision!==revision)throw Error('La partie a changé. Réessaie.');if(data.players?.length!==4||data.players[currentSeat()]?.uid!==uid)throw Error('Ce n’est pas ton tour');const previous=state();try{if(kind==='roll')original.roll(value);else if(kind==='move')original.move(value);else if(kind==='claim')original.claim();const next=state();tx.update(ref,{state:next,revision:revision+1});return next;}finally{load(previous);}});load(result);revision++;}catch(err){status('Action non enregistrée : '+err.message)}finally{busy=false;controls()}}
